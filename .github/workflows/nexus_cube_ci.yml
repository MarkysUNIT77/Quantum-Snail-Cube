name: "A.G.A.R.D.A. Quantum-Snail-Cube // v110.0-HD Runner"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  congruence_matrix_validation:
    name: "Substrate Congruence Verify"
    runs-on: ubuntu-latest

    steps:
      - name: "Isolate Workspace and Fetch Source Matrix"
        uses: actions/checkout@v4

      - name: "Deploy Pure Python Infrastructure Layer"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Annihilate Intermediate Bloatware and Inject Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Execute Swarm Simulation and Verify Core Resonance (80.08 Hz)"
        run: |
          echo "[START] Инициализация тестового залпа на Runner-матрице..."
          python agarda_benchmark.py
          echo "[SUCCESS] Проверка конгруэнтности пройдена. Ошибки и баги: 0.00%."

